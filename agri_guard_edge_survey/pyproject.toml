[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-guard-edge-survey"
version = "0.1.0"
description = "AgriGuard edge CLI for aerial survey image AI (local GPU/MPS, no raw upload)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # PEP 508 file URL resolves against `pip`'s cwd. Run installs from repo root
    # (e.g. `pip install -e ./agri_guard_edge_survey`) so `./agri_guard_core` exists.
    "agri-guard-core @ file:./agri_guard_core",
    "click>=8.0",
    "tqdm>=4.60",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "pillow>=10.0",
    "numpy>=1.24",
    "ultralytics>=8.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
survey = "agri_guard_edge_survey.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agri_guard_edge_survey*"]
